<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intentional - Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="page-header">
        <div>
          <h1>
            <span class="brand-dot" aria-hidden="true"></span>
            Intentional
          </h1>
          <p class="lede">A small pause before distracting sites.</p>
          <nav class="page-nav" aria-label="Extension pages">
            <a href="options.html" class="page-nav-link" aria-current="page"
              >Settings</a
            >
            <a href="insights.html" class="page-nav-link">Insights</a>
          </nav>
        </div>
      </header>

      <section class="card">
        <h2>Settings</h2>

        <label class="field">
          <span class="label">Pause length (seconds)</span>
          <input
            id="pause-seconds"
            type="number"
            min="0"
            max="600"
            step="1"
            inputmode="numeric"
          />
          <span class="hint">
            How long the calm breath runs before the prompt.
          </span>
        </label>

        <label class="field">
          <span class="label">After you continue</span>
          <select id="allow-grace-mode">
            <option value="continue">Ask again after you continue</option>
            <option value="tab">Stay unblocked until I close the tab</option>
            <option value="minutes">Ask again after a fixed window</option>
          </select>
          <div id="allow-grace-row" class="field-row hidden">
            <input
              id="allow-grace"
              type="number"
              min="1"
              max="240"
              step="1"
              inputmode="numeric"
            />
            <span class="field-unit">minutes</span>
          </div>
          <span class="hint">
            Controls how long the same blocked site stays open in that tab
            before the pause appears again. Subdomains count as the same site.
            Whole minutes only.
          </span>
        </label>

        <label class="field">
          <span class="label">Check-in interval (minutes)</span>
          <input
            id="check-in-minutes"
            type="number"
            min="1"
            max="240"
            step="1"
            inputmode="numeric"
          />
          <span class="hint">
            After you continue past the entry gate, how long before a gentle
            in-page check-in appears — and the same interval between each
            check-in if you stay. Default 10. Whole minutes only.
          </span>
        </label>

        <label class="field">
          <span class="label">Blocked sites</span>
          <textarea
            id="blocked-sites"
            rows="6"
            placeholder="x.com&#10;twitter.com&#10;youtube.com"
          ></textarea>
          <span class="hint">
            One hostname per line. Subdomains are matched automatically
            (e.g. <code>twitter.com</code> also catches
            <code>mobile.twitter.com</code>).
          </span>
        </label>

        <div class="row">
          <button id="save-btn" class="btn btn-primary" type="button">Save</button>
          <button id="reset-btn" class="btn btn-secondary" type="button">
            Reset to defaults
          </button>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </section>

      <footer class="page-footer">
        Everything stays on your computer. No accounts, no servers, no tracking.
      </footer>
    </main>

    <script src="../lib/defaults.js"></script>
    <script src="shared.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
